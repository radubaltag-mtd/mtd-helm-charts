apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/radubaltag-mtd/mtd-helm-charts.git
    targetRevision: main
    path: charts/nodejs-api
  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
